hunav_sim:
  agents_file: 'hunav_agent_manager/config/custom_agents.yaml'
  bt_dir: 'hunav_agent_manager/behavior_trees'
  cpp_dir: 'hunav_agent_manager/src'
  hpp_dir: 'hunav_agent_manager/include/hunav_agent_manager'

seed: 1
# LLM backend configuration.
# Each query stage (scenario / trajectory / bt) can use a different provider+model.
#   provider:   which LLM backend to use. Routed through the `instructor` library,
#               so any instructor-supported provider works. Examples:
#                 openai     -> model_name: "gpt-4.1", "gpt-4o", "gpt-5"
#                 anthropic  -> model_name: "claude-opus-4-8", "claude-sonnet-4-6",
#                                            "claude-haiku-4-5-20251001"   (set max_tokens)
#                 google     -> model_name: "gemini-2.5-flash", "gemini-2.5-pro"
#                 mistral    -> model_name: "mistral-large-latest"
#                 groq       -> model_name: "llama-3.3-70b-versatile"
#                 ollama     -> model_name: "llama3.2"   (local)
#               Use provider: "gpt-native" for OpenAI's native structured-output
#               parse instead of instructor (OpenAI only).
#   model_name: the provider's model id.
#   Optional per-model keys: temperature, max_tokens (required for anthropic),
#                            max_retries, extra_kwargs.
# Set the matching API key in the environment (OPENAI_API_KEY, ANTHROPIC_API_KEY,
# GEMINI_API_KEY / GOOGLE_API_KEY, ...).

scenario_model:
  provider: "openai"
  model_name: "gpt-4o"
  # temperature: 0.5
  # max_tokens: 4096        # required when provider is anthropic

trajectory_model:
  provider: "openai"        # this stage sends images: use a vision-capable model
  model_name: "gpt-4o"     #   (openai gpt-4.1/4o, anthropic claude-*, google gemini-* all support vision)
  # temperature: 0.5

bt_model:
  provider: "openai"
  model_name: "gpt-4o"
  # temperature: 0.5

num_scenario_proposals: 5

retry_count: 3
debug: true

node_library:
  Fallback:
    name: string
  Sequence:
    name: string
  Inverter: {}
  TimeExpiredCondition:
    only_once: bool
    seconds: float
    ts: "{dt}"
 
  # Actions
  BlockRobot:
    agent_id: "{id}"
    time_step: "{dt}"
  FollowHuman:
    agent_id: "{id}"
    target_id: int
    time_step: "{dt}"
  FollowRobot:
    agent_id: "{id}"
    time_step: "{dt}"
  GiveWaytoRobot:
    agent_id: "{id}"
    time_step: "{dt}"
  LookAtRobot:
    agent_id: "{id}"
  MakeGesture:
    agent_id: "{id}"
    message: string
  RegularNav:
    agent_id: "{id}"
    time_step: "{dt}"
  RunAwayFromRobot:
    agent_id: "{id}"
    time_step: "{dt}"
 
  # Conditions
  HumanSays:
    agent_id: "{id}"
    message: string
    target_id: int
  IsGoalReached:
    agent_id: "{id}"
  IsRobotBlocking:
    agent_id: "{id}"
    distance: float
  IsRobotNearby:
    agent_id: "{id}"
    distance: float
  IsRobotVisible:
    agent_id: "{id}"
    distance: float
  RobotMoved:
    agent_id: "{id}"
  RobotSays:
    agent_id: "{id}"
    message: string

scenario_file: 'responses/scenario.json'
trajectory_file: 'responses/trajectory.json'
bt_file: 'responses/bt.json'
user_feedback: False
use_handcrafted_scenario: false
